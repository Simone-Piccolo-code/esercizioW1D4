<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EsercizioAmazon</title>
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
    <header>
        <div class="firstbar">
            <img class="logo" src="./assets/img/logo.png" alt="Logo Amazon">
        </div>

        <nav>
            <span>All</span>
            <span>Today's deals</span>
            <span> Customer Service</span>
            <span>Registry</span>
            <span>Gift Cards</span>
            <span>Sell</span>
        </nav>
    </header>

    <main>
        <div>
            <div class="giftcardsbar">
                <p>Shop All Holiday Gift Cards</p>
            </div>
        </div>
        <div class="giftguide">
            <h1>Holiday Gift Guides</h1>
            <h3>Be a go-gifter</h3>
        </div>

        <section class="section1">
            <div class="findgift">
                <span>Find the perfect gift</span>
                <span><a href="#">Shop now</a></span>
            </div>
            <img class="imgsection1" src="./assets/img/img_1.jpg" alt="Tablet">
            <img class="imgsection1" src="./assets/img/img_2.jpg" alt="PC">
            <img class="imgsection1" src="./assets/img/img_3.jpg" alt="swatch">
            <img class="imgsection1" src="./assets/img/img_4.jpg" alt="Animals">
        </section>

        <section class="section2">
            <figure>
                <img src="./assets/img/img_9.png" alt="vr">
                <figcaption>
                    <span>Play the gifting game</span>
                    <a href="#">Shop gaming</a>
                </figcaption>
            </figure>
        </section>

        <section class="section3">
            <figure>
                <img src="./assets/img/img_10.png" alt="sound">
                <figcaption>
                    <span>The sound of cheer</span>
                    <a href="#">Shop Audio & Accessories</a>
                </figcaption>
            </figure>
        </section>
    </main>
    
    <footer>
        <div class="back">
            <a href="#">Back on top</a>
        </div>
        <div class="end">
            <img src="./assets/img/logo.png" alt="Amazon">
        </div>
    </footer>

</body>
</html>
